# Local PostgreSQL for development:  docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparkle
      POSTGRES_PASSWORD: sparkle_dev_pw
      POSTGRES_DB: sprinkle_sparkle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
